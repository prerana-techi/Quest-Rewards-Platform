name: Production Deployment Pipeline

on:
  push:
    branches: [main]

jobs:
  validate-and-deploy:
    name: Full Pipeline Verification
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NEXT_PUBLIC_QUEST_CORE_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMDR4
      NEXT_PUBLIC_QUEST_REPUTATION_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAK3IM
      NEXT_PUBLIC_NATIVE_TOKEN_ADDRESS: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Contract Tests
        run: cargo test --manifest-path contracts/Cargo.toml

      - name: Build Contracts WASM
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Production Next.js App
        run: npm run build
